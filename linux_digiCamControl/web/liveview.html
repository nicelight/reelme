<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReelMe · Live View</title>
<style>
:root { color-scheme:dark; font:16px system-ui,sans-serif; background:#111712; color:#e8eee5; }
body { max-width:960px; margin:32px auto; padding:0 18px; }
button,a { font:inherit; margin-right:12px; } button { padding:10px 18px; cursor:pointer; }
a { color:#cfff92; } img { display:block; width:100%; max-height:65vh; object-fit:contain; margin:20px 0; transform:scaleX(-1); }
#preview[hidden] { display:none; }
#status { min-height:1.5em; }
</style>
<h1>Live View</h1>
<p>Локальное зеркальное превью веб-камеры. Снимки при этом не создаются.</p>
<button id="start">Включить превью</button><button id="stop" disabled>Остановить</button>
<a href="/reelme-test.html">Тест трёх снимков</a>
<p id="status" role="status">Камера не включена.</p>
<img id="preview" alt="Зеркальное превью камеры" hidden>
<script>
const start = document.getElementById('start'), stop = document.getElementById('stop');
const status = document.getElementById('status'), preview = document.getElementById('preview');
let controller, url;
async function request(path, signal) {
  const response = await fetch(path, {cache:'no-store', signal});
  if (!response.ok) throw Error((await response.json()).error || `HTTP ${response.status}`);
  return response;
}
function clear() {
  controller?.abort(); controller = undefined;
  if (url) URL.revokeObjectURL(url);
  url = undefined; preview.hidden = true; preview.removeAttribute('src');
  start.disabled = false; stop.disabled = true;
}
start.onclick = async () => {
  controller = new AbortController(); const signal = controller.signal;
  start.disabled = true; stop.disabled = false; status.textContent = 'Подключаем камеру…';
  try {
    await request('/liveview.html?CMD=LiveViewWnd_Show', signal);
    while (!signal.aborted) {
      const blob = await (await request('/liveview.jpg', signal)).blob();
      signal.throwIfAborted();
      const next = URL.createObjectURL(blob); if (url) URL.revokeObjectURL(url);
      url = next; preview.src = url; preview.hidden = false; status.textContent = 'Превью включено.';
      await new Promise(resolve => setTimeout(resolve, 200));
    }
  } catch (error) { if (!signal.aborted) { clear(); status.textContent = error.message; } }
};
stop.onclick = async () => {
  clear(); start.disabled = true; status.textContent = 'Превью остановлено.';
  try { await request('/liveview.html?CMD=LiveViewWnd_Hide'); }
  catch (error) { status.textContent = error.message; }
  finally { start.disabled = false; }
};
addEventListener('pagehide', () => {
  if (controller) { clear(); void fetch('/liveview.html?CMD=LiveViewWnd_Hide', {keepalive:true}).catch(() => {}); }
});
</script>
</html>
