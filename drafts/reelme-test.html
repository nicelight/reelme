<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReelMe — проверка камеры</title>
<style>
:root {
  color-scheme: dark;
  font: 16px system-ui, Arial, sans-serif;
  background: #111712;
  color: #e8eee5;
}
* { box-sizing: border-box; }
body { max-width: 960px; margin: 35px auto; padding: 0 18px; }
h1 { margin-bottom: 7px; }
p { color: #b7c4b3; line-height: 1.5; }
button {
  border: 0;
  border-radius: 10px;
  padding: 13px 20px;
  font: 600 15px system-ui;
  cursor: pointer;
  background: #cfff92;
  color: #14200b;
}
button:disabled { opacity: .4; cursor: not-allowed; }
.secondary { background: #344631; color: #e8eee5; }
.box {
  border: 1px solid #364835;
  border-radius: 15px;
  background: #1a241b;
  padding: 23px;
  margin: 18px 0;
}
#stage {
  height: 370px;
  background: #0d140f;
  border-radius: 12px;
  display: grid;
  place-items: center;
  overflow: hidden;
  text-align: center;
  position: relative;
}
#photo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  background: #0d140f;
}
#stageText {
  font-size: 28px;
  font-weight: 700;
  padding: 20px;
  z-index: 1;
}
#gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 10px;
}
#gallery img {
  width: 100%;
  aspect-ratio: 3/2;
  object-fit: contain;
  border-radius: 8px;
  background: #101611;
}
#gallery a {
  font-size: 12px;
  color: #cfff92;
  overflow-wrap: anywhere;
}
#gallery .item {
  padding: 8px;
  background: #263328;
  border-radius: 10px;
}
pre {
  max-height: 220px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #0b110c;
  padding: 12px;
  border-radius: 8px;
  font: 12px/1.5 Consolas,monospace;
}
#result { font-size: 20px; font-weight: 700; }
#result.ok { color: #cfff92; }
#result.bad { color: #ffb3a0; }
@media(max-width:600px) {
  #gallery { grid-template-columns: repeat(2,minmax(0,1fr)); }
  #stage { height: 280px; }
}
</style>
</head>
<body>

<h1>ReelMe · Camera Test</h1>
<p>
  Три прогона по три кадра: снимок → показ 0,5 с →
  звуковой отсчёт 3 с → следующий снимок.
  Фотографии никому не отправляются.
</p>

<div class="box">
  <div id="stage">
    <img id="photo" hidden alt="Полученный кадр">
    <div id="stageText">Камера готова к проверке</div>
  </div>

  <p id="progress">Ожидание запуска</p>
  <button id="start">Запустить тест</button>
  <button id="logsBtn" class="secondary">
    Скачать логи для Сергея
  </button>
  <p id="result" role="status" aria-live="polite"></p>
</div>

<div class="box">
  <h2>Полученные JPEG</h2>
  <div id="gallery"></div>
</div>

<details class="box">
  <summary>Технический журнал</summary>
  <pre id="logs"></pre>
</details>

<script>
'use strict';

const $ = id => document.getElementById(id);
const shots = [], lines = [];
let running = false, audio;

function log(message) {
  const s = `[${new Date().toLocaleString('ru-RU')}] ${message}`;
  lines.push(s);
  $('logs').textContent = lines.join('\n');
  $('logs').scrollTop = $('logs').scrollHeight;
}

function fail(message) {
  log('ОШИБКА: ' + message);
  $('result').className = 'bad';
  $('result').textContent =
    'Ошибка. Скачайте логи и отправьте Сергею. ' + message;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function display(text) {
  $('photo').hidden = true;
  $('stageText').hidden = false;
  $('stageText').textContent = text;
}

function beep(freq = 750, duration = .08) {
  try {
    audio ??= new (window.AudioContext ||
                    window.webkitAudioContext)();
    const o = audio.createOscillator();
    const v = audio.createGain();
    o.frequency.value = freq;
    v.gain.value = .07;
    o.connect(v);
    v.connect(audio.destination);
    o.start();
    o.stop(audio.currentTime + duration);
  } catch(e) {
    log('Звук недоступен: ' + e.message);
  }
}

async function countdown() {
  for(let n = 3; n >= 1; n--) {
    display('Снимок через ' + n);
    beep();
    await sleep(1000);
  }
}

async function getJSON(url) {
  const r = await fetch(
    url + (url.includes('?') ? '&' : '?') +
    '_=' + Date.now(),
    {cache: 'no-store'}
  );

  if(!r.ok) throw Error(url + ': HTTP ' + r.status);

  const data = await r.json();
  if(!Array.isArray(data))
    throw Error('Ответ ' + url + ' не является массивом фотографий');

  return data;
}

function pathOf(item) {
  return item.Original || item.original || '';
}

function isJpeg(path) {
  return /\.jpe?g(?:\?.*)?$/i.test(path);
}

function names(items) {
  return new Set(items.map(pathOf).filter(Boolean));
}

async function captureOne() {
  const before = names(await getJSON('/filelist.json'));

  log('Команда Capture; до съёмки файлов: ' + before.size);

  const r = await fetch(
    '/?CMD=Capture&_=' + Date.now(),
    {cache: 'no-store'}
  );

  if(!r.ok) throw Error('Capture: HTTP ' + r.status);

  const until = Date.now() + 30000;
  let lastError = '';

  while(Date.now() < until) {
    await sleep(350);

    try {
      const current = await getJSON('/filelist.json');
      const next = current.find(f =>
        isJpeg(pathOf(f)) && !before.has(pathOf(f))
      );

      if(next) {
        const path = pathOf(next);

        if(!path.startsWith('/image/'))
          throw Error('Неожиданный путь фотографии: ' + path);

        try {
          const response = await fetch(
            path + '?t=' + Date.now(),
            {cache: 'no-store'}
          );

          if(!response.ok)
            throw Error('JPEG: HTTP ' + response.status);

          const blob = await response.blob();

          if(blob.size < 5000)
            throw Error('Файл слишком мал: ' + blob.size);

          const start = new Uint8Array(
            await blob.slice(0,3).arrayBuffer()
          );
          const end = new Uint8Array(
            await blob.slice(-2).arrayBuffer()
          );

          if(
            start[0] !== 255 ||
            start[1] !== 216 ||
            end[0] !== 255 ||
            end[1] !== 217
          ) {
            throw Error('Получен неполный JPEG');
          }

          const link = URL.createObjectURL(blob);
          const testImage = new Image();
          testImage.src = link;

          try {
            await testImage.decode();
          } catch(e) {
            URL.revokeObjectURL(link);
            throw Error('Ошибка декодирования JPEG');
          }

          log(
            'JPEG получен: ' + path + ', ' +
            blob.size + ' байт, ' +
            testImage.naturalWidth + '×' +
            testImage.naturalHeight
          );

          return {
            path,
            blob,
            link,
            width: testImage.naturalWidth,
            height: testImage.naturalHeight
          };

        } catch(e) {
          lastError = e.message;
        }
      }
    } catch(e) {
      lastError = e.message;
    }
  }

  throw Error(
    'Новый JPEG не получен за 30 секунд. ' + lastError
  );
}

async function showPhoto(shot) {
  $('stageText').hidden = true;
  $('photo').src = shot.link;
  $('photo').hidden = false;

  await sleep(500);

  $('photo').hidden = true;
  $('stageText').hidden = false;
}

function addThumb(shot, number) {
  const item = document.createElement('div');
  item.className = 'item';

  const img = document.createElement('img');
  img.src = shot.link;
  img.alt = 'Кадр ' + number;

  const a = document.createElement('a');
  a.href = shot.link;
  a.download = 'ReelMe-' + number + '.jpg';
  a.textContent =
    'Кадр ' + number + ' · ' +
    (shot.blob.size / 1048576).toFixed(2) + ' МБ';

  item.append(img, a);
  $('gallery').append(item);
}

async function checkUploadReady(group) {
  // Готовим multipart/form-data без сетевого запроса.
  const form = new FormData();

  group.forEach((s, i) => {
    form.append('photos', s.blob, 'frame-' + (i+1) + '.jpg');
  });

  const body = await new Response(form).arrayBuffer();

  const bytes = group.reduce(
    (n, s) => n + s.blob.size, 0
  );

  if(body.byteLength <= bytes)
    throw Error('Не удалось сформировать multipart/form-data');

  log(
    '3 JPEG подготовлены к отправке: ' +
    bytes + ' байт оригиналов, ' +
    body.byteLength + ' байт multipart. ' +
    'Сервер не вызывался.'
  );
}


async function run() {
  if (running) return;

  running = true;
  $('start').disabled = true;
  $('result').textContent = '';
  $('result').className = '';
  $('gallery').replaceChildren();

  for (const x of shots)
    URL.revokeObjectURL(x.link);

  shots.length = 0;
  lines.length = 0;
  $('logs').textContent = '';

  try {
    if (
      location.hostname !== 'localhost' &&
      location.hostname !== '127.0.0.1'
    ) {
      throw Error(
        'Откройте страницу через http://localhost:5513/reelme-test.html'
      );
    }

    display('Проверка digiCamControl…');
    await getJSON('/filelist.json');
    log('HTTP API доступен.');

    for (let shotNo = 1; shotNo <= 3; shotNo++) {
      $('progress').textContent = `Кадр ${shotNo}/3`;

      if (shotNo > 1)
        await countdown();

      display('Снимаем…');
      beep(1200, .14);

      const shot = await captureOne();

      shots.push(shot);
      addThumb(shot, shots.length);
      await showPhoto(shot);
    }

    await checkUploadReady(shots);

    display('Успешно!');
    $('progress').textContent = '3 фотографии получены';

    $('result').className = 'ok';
    $('result').textContent =
      'УСПЕШНО: 3 фотографии получены ' +
      'и подготовлены к отправке.';

    log('Прогон успешно завершён.');

  } catch (e) {
    display('Тест остановлен');
    fail(e.message || String(e));

  } finally {
    running = false;
    $('start').disabled = false;
    $('start').textContent = 'Запустить ещё раз';
  }
}


$('start').addEventListener('click', run);

$('logsBtn').addEventListener('click', () => {
  const text =
    'ReelMe Camera Test\n' +
    navigator.userAgent +
    '\nURL: ' + location.href +
    '\n\n' + lines.join('\n');

  const url = URL.createObjectURL(
    new Blob([text], {
      type: 'text/plain;charset=utf-8'
    })
  );

  const a = document.createElement('a');
  a.href = url;
  a.download = 'ReelMe-camera-log.txt';
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 5000);
});

if(location.protocol === 'file:') {
  display('Откройте через localhost:5513');
  $('progress').textContent =
    'Открытие двойным кликом не подходит.';
}
</script>
</body>
</html>
